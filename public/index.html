<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Million Checkboxes</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: white;
            position: relative;
            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 0, 153, 0.22),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 15%,
                    rgba(0, 229, 255, 0.20),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 70% 85%,
                    rgba(125, 68, 255, 0.25),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #09051c 0%,
                    #12082b 35%,
                    #090d26 70%,
                    #050714 100%
                );

            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 30px 100px;
        }

        body::before {
            content: "";

            position: fixed;

            width: 420px;
            height: 420px;

            top: -180px;
            left: -120px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 0, 153, 0.18),
                    transparent 70%
                );

            filter: blur(20px);

            animation: floatingGlow 8s ease-in-out infinite;

            pointer-events: none;
        }

        body::after {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            right: -180px;
            bottom: -220px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(0, 229, 255, 0.16),
                    transparent 70%
                );

            filter: blur(25px);

            animation: floatingGlow 10s ease-in-out infinite reverse;

            pointer-events: none;
        }

        @keyframes floatingGlow {
            0%,
            100% {
                transform: translate3d(0, 0, 0) scale(1);
            }

            50% {
                transform: translate3d(35px, 25px, 0) scale(1.12);
            }
        }

        h1 {
            position: relative;
            z-index: 2;

            font-size: clamp(48px, 7vw, 82px);
            line-height: 1;
            font-weight: 900;
            letter-spacing: -4px;
            text-align: center;

            background:
                linear-gradient(
                    90deg,
                    #ffffff 0%,
                    #ff72d2 30%,
                    #9d8cff 55%,
                    #55e8ff 80%,
                    #ffffff 100%
                );

            background-size: 250% auto;

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            animation: gradientText 6s linear infinite;

            filter:
                drop-shadow(
                    0 0 30px
                    rgba(185, 100, 255, 0.25)
                );
        }

        @keyframes gradientText {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 250% center;
            }
        }

        h1::after {
            content: "A tiny playground of clickable squares. Tick away.";

            display: block;

            margin-top: 25px;

            font-size: clamp(15px, 2vw, 20px);
            line-height: 1.5;
            font-weight: 400;
            letter-spacing: 0.2px;

            color: rgba(255, 255, 255, 0.58);

            text-shadow:
                0 0 20px
                rgba(255, 255, 255, 0.08);
        }

        #error-message {
            position: relative;
            z-index: 10;

            display: none;

            min-width: 300px;

            margin-top: 30px;

            padding: 14px 24px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 64, 129, 0.18),
                    rgba(255, 0, 85, 0.10)
                );

            border:
                1px solid
                rgba(255, 100, 150, 0.45);

            color: #ffb8d1;

            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.2px;
            text-align: center;

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.30),

                0 0 25px
                rgba(255, 40, 120, 0.12),

                inset 0 1px 0
                rgba(255, 255, 255, 0.10);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            animation: errorAppear 0.3s ease;
        }

        @keyframes errorAppear {
            from {
                opacity: 0;
                transform: translateY(-12px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        #container {
            position: relative;
            z-index: 2;

            width: min(1100px, 96%);

            margin-top: 70px;

            padding: 55px 60px;

            display: grid;

            grid-template-columns: repeat(10, 1fr);

            gap: 24px 28px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.075),
                    rgba(255, 255, 255, 0.025)
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.13);

            box-shadow:
                0 40px 100px
                rgba(0, 0, 0, 0.50),

                0 0 60px
                rgba(120, 70, 255, 0.07),

                inset 0 1px 0
                rgba(255, 255, 255, 0.10);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        #container::before {
            content: "";

            position: absolute;

            top: 0;
            left: 8%;

            width: 84%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.35),
                    transparent
                );
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;

            position: relative;

            width: 48px;
            height: 48px;

            justify-self: center;

            border-radius: 14px;

            cursor: pointer;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.075),
                    rgba(255, 255, 255, 0.025)
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.16);

            box-shadow:
                0 8px 18px
                rgba(0, 0, 0, 0.22),

                inset 0 1px 0
                rgba(255, 255, 255, 0.08);

            transition:
                transform 0.2s cubic-bezier(.2,.8,.2,1),
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        input[type="checkbox"]:hover {
            transform:
                translateY(-4px)
                scale(1.08);

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.14),
                    rgba(255, 255, 255, 0.045)
                );

            border-color:
                rgba(130, 220, 255, 0.55);

            box-shadow:
                0 12px 25px
                rgba(0, 0, 0, 0.28),

                0 0 22px
                rgba(0, 210, 255, 0.16),

                inset 0 1px 0
                rgba(255, 255, 255, 0.12);
        }

        input[type="checkbox"]:checked {
            background:
                linear-gradient(
                    135deg,
                    #ff4ecd 0%,
                    #8b5cf6 48%,
                    #22d3ee 100%
                );

            border-color:
                rgba(255, 255, 255, 0.75);

            box-shadow:
                0 0 25px
                rgba(192, 80, 255, 0.55),

                0 0 50px
                rgba(34, 211, 238, 0.18),

                inset 0 1px 0
                rgba(255, 255, 255, 0.30);

            transform: scale(1.08);
        }

        input[type="checkbox"]:checked::after {
            content: "✓";

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #ffffff;

            font-size: 25px;

            font-weight: 900;

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.25);
        }

        input[type="checkbox"]:active {
            transform: scale(0.88);
        }

        input[type="checkbox"]:focus-visible {
            outline: none;

            box-shadow:
                0 0 0 3px
                rgba(255, 255, 255, 0.12),

                0 0 0 6px
                rgba(130, 100, 255, 0.45),

                0 10px 25px
                rgba(0, 0, 0, 0.25);
        }

        @media (max-width: 900px) {
            body {
                padding: 50px 20px 80px;
            }

            #container {
                grid-template-columns: repeat(8, 1fr);

                gap: 20px;

                padding: 45px 35px;
            }

            input[type="checkbox"] {
                width: 46px;
                height: 46px;
            }
        }

        @media (max-width: 650px) {
            body {
                padding: 45px 15px 70px;
            }

            h1 {
                letter-spacing: -2px;
            }

            h1::after {
                margin-top: 18px;
                padding: 0 15px;
            }

            #error-message {
                width: 90%;
                min-width: 0;
                font-size: 14px;
            }

            #container {
                width: 100%;

                margin-top: 50px;

                padding: 30px 18px;

                grid-template-columns: repeat(5, 1fr);

                gap: 18px 12px;

                border-radius: 22px;
            }

            input[type="checkbox"] {
                width: 42px;
                height: 42px;

                border-radius: 11px;
            }

            input[type="checkbox"]:checked::after {
                font-size: 21px;
            }
        }

        @media (max-width: 380px) {
            #container {
                grid-template-columns: repeat(4, 1fr);

                gap: 16px 10px;
            }
        }
    </style>
</head>

<body>

    <h1>Checkboxes</h1>

    <div id="error-message"></div>

    <div id="container"></div>

    <script src="/socket.io/socket.io.js"></script>

    <script>

        const socket = io()
        /*
        const container = document.getElementById('container');
        const CHECKBOX_COUNT = 100;

        for (let i = 0; i < CHECKBOX_COUNT; i++) {
        const input = document.createElement('input');
        input.type = 'checkbox';
        container.appendChild(input);
        }*/

        const container = document.getElementById('container')
        const CHECKBOX_COUNT=100;


        const errorMessage =
            document.getElementById('error-message');

        let errorTimeout;

        socket.on('server:error',(data)=>{

            const error = data.error;
            clearTimeout(errorTimeout);
            errorMessage.textContent =
                error;
            errorMessage.style.display =
                'block';

            errorTimeout = setTimeout(()=>{

                errorMessage.style.display =
                    'none';

            }, 3000);

        });


        socket.on('server:checkbox:change',data=>{
            console.log(`Socket Server Event`,data);
            const {index,checked}=data;
            const input = document.getElementById(`checkbox-${index}`)
            if (input){
                input.checked=checked;
            }
        });

        async function fetchStateFromServer() {
            while (container.firstChild){
                container.removeChild(container.firstChild);
            }

            const response = await fetch('/checkboxes',{ method:'GET' })
            const data = await response.json()

            if(data && data.checkboxes){
                data.checkboxes.forEach((serverValue,index)=>{
                    const input = document.createElement('input');

                input.type='checkbox';
                //Assigning Ids to checkboxes with their own index
                input.id=`checkbox-${index}`;
                input.checked=serverValue;

                // Track if checkboxes changed or not
                input.addEventListener('change',event =>{
                    const checked = event.target.checked;
                    console.log('Checkbox Changed', { index,checked })
                    socket.emit('client:checkbox:change',{ index , checked })
                    fetchStateFromServer();
                });
                container.appendChild(input);
                });
            }
        }

        window.addEventListener('load',async()=>{
            fetchStateFromServer()
        })

    </script>

</body>
</html>
